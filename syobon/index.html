<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>しょぼんのアクション</title>
    <meta name="robots" content="noindex,follow" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      canvas {
        display: none;
        background: #000;
        width: 800px;
        height: 700px;
        outline: none;
      }
      #play-button {
        display: inline-block;
        padding: 20px 60px;
        font-size: 28px;
        background: #007acc;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        margin-bottom: 20px;
      }
    </style>
    <link rel="canonical" href="https://game16.net/burage/act/cat-mario/" />
  </head>
  <body>
    <button id="play-button">&#9654; Play</button>
    <canvas id="canvas" width="800" height="700" tabindex="0"></canvas>

    <script>
      // ページロード後にボタン強制表示（iframeでも確実に表示）
      window.onload = function () {
        const playButton = document.getElementById("play-button");
        playButton.style.display = "inline-block";
      };

      document.getElementById("play-button").addEventListener("click", () => {
        const canvas = document.getElementById("canvas");
        const playButton = document.getElementById("play-button");

        playButton.style.display = "none";
        canvas.style.display = "block";
        canvas.focus();

        window.Module = {
          canvas: canvas,
          locateFile: function (path) {
            return path;
          },
          onRuntimeInitialized: function () {
            canvas.focus();
            // Enterキー送信は不要。ユーザーに押してもらう設計。
          },
        };

        const script = document.createElement("script");
        script.src = "emi.min.js";
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
